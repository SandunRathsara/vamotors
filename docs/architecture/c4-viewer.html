<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture explorer</title>
<style>
  :root { color-scheme: light dark; --ink: #142335; --quiet: #4e6275; --soft: #edf3f6; --surface: #ffffff; --stroke: #d5e2e8; --accent: #087f79; --accent-soft: #d9f3ed; --line: #7193a0; --grid: #cfdee5; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eff9f9; --quiet: #a9c2ce; --soft: #162633; --surface: #172a37; --stroke: #395666; --accent: #64e1c4; --accent-soft: #183f40; --line: #8bafba; --grid: #25414f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; color: var(--ink); font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; min-width: 0; overflow-wrap: anywhere; }
  .masthead { display: flex; align-items: center; gap: 14px; padding: 24px 0 20px; border-bottom: 1px solid var(--stroke); }
  .mark { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; color: #fff; background: #087f79; font-weight: 900; letter-spacing: -.08em; box-shadow: 0 6px 18px #087f7933; }
  .brand { font-weight: 760; font-size: 18px; letter-spacing: -.035em; line-height: 1.15; }
  .brand-note { color: var(--quiet); font-size: 12px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; }
  .masthead-count { margin-left: auto; color: var(--quiet); font-size: 13px; font-weight: 650; white-space: nowrap; }
  button, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--stroke); border-radius: 10px; min-height: 44px; padding: 8px 14px; }
  button, summary, select { cursor: pointer; }
  button:hover:not(:disabled), summary:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { cursor: not-allowed; opacity: .48; }
  button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 750; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  [hidden] { display: none !important; }
  p { margin: 0 0 12px; max-width: 75ch; }
  h1, h2, h3 { line-height: 1.18; letter-spacing: -.035em; }
  h1 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 10px; }
  h2 { font-size: 23px; margin: 0 0 12px; }
  h3 { font-size: 18px; margin: 0 0 8px; }
  ul, ol { padding-left: 23px; }
  li + li { margin-top: 8px; }
  a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
  .muted, .scope { color: var(--quiet); }
  .levels { display: flex; flex-wrap: wrap; gap: 6px; padding: 18px 0; border-bottom: 1px solid var(--stroke); }
  .levels button { background: transparent; border-color: transparent; font-size: 14px; font-weight: 650; }
  .levels button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .levels button:disabled { display: none; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin: 22px 0 24px; }
  .picker { display: grid; gap: 6px; min-width: 0; max-width: 100%; }
  .picker label { font-size: 12px; font-weight: 750; color: var(--quiet); letter-spacing: .07em; text-transform: uppercase; }
  select { max-width: 100%; width: min(430px, 100%); background: var(--surface); font-weight: 600; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools button { color: var(--quiet); font-size: 13px; font-weight: 650; }
  .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 10px; }
  #view-summary { font-size: 17px; line-height: 1.55; }
  .scope { font-size: 13px; margin: 0 0 15px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--quiet); font-size: 12px; font-weight: 650; text-transform: capitalize; }
  .swatch { width: 8px; height: 8px; border-radius: 50%; background: #087f79; }
  .swatch.external { background: #c28032; }
  .swatch.planned { background: #5580d6; }
  .swatch.recommended { background: #8a67bf; }
  .swatch.mock { background: #8e8892; }
  .swatch.blocked { background: #e0675d; }
  .hint { margin: 10px 0 14px; color: var(--quiet); font-size: 13px; }
  .diagram-scroll { width: 100%; max-width: 100%; overflow: auto; border: 1px solid var(--stroke); border-radius: 18px; background-color: var(--soft); background-image: radial-gradient(var(--grid) .8px, transparent .8px); background-size: 20px 20px; }
  .diagram-scroll svg { display: block; width: 100%; height: auto; margin: 0 auto; max-width: none; }
  .boundary { fill: var(--surface); fill-opacity: .36; stroke: var(--stroke); stroke-width: 1.5; stroke-dasharray: 6 7; }
  .group-label { fill: var(--quiet); font: 700 12px system-ui, sans-serif; letter-spacing: .025em; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge-label-bg { fill: var(--surface); stroke: var(--stroke); stroke-width: 1; }
  .edge-label { fill: var(--quiet); font: 650 11px system-ui, sans-serif; }
  .node { cursor: pointer; outline: none; --node-accent: #5580d6; --node-tint: #eaf0fc; }
  .node.implemented { --node-accent: #087f79; --node-tint: #e5f7f1; }
  .node.external { --node-accent: #bd7834; --node-tint: #fff0d9; }
  .node.recommended { --node-accent: #8263b8; --node-tint: #efe9fb; }
  .node.mock { --node-accent: #817c8f; --node-tint: #eceaf0; }
  .node.blocked { --node-accent: #c9504e; --node-tint: #ffe8e5; }
  .node-box { fill: var(--surface); stroke: var(--stroke); stroke-width: 1.5; }
  .node:hover .node-box, .node:focus-visible .node-box, .node[aria-pressed="true"] .node-box { stroke: var(--node-accent); stroke-width: 3; }
  .node-label { height: 100%; padding: 12px 14px 11px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; overflow-wrap: anywhere; line-height: 1.2; color: var(--ink); }
  .node-label::before { content: ""; width: 28px; height: 4px; border-radius: 8px; background: var(--node-accent); margin-bottom: 7px; }
  .node-name { font-size: 16px; font-weight: 780; letter-spacing: -.035em; }
  .node-meta { font-size: 11px; color: var(--quiet); }
  .node-status { margin-top: 3px; font-size: 10px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--node-accent); }
  .detail-panel { border: 1px solid var(--stroke); border-left: 5px solid var(--accent); border-radius: 12px; background: var(--surface); padding: 20px; margin-top: 18px; overflow-wrap: anywhere; }
  .detail-heading { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .tag { display: inline-block; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 650; background: var(--soft); color: var(--quiet); margin: 0 6px 10px 0; }
  details { border-top: 1px solid var(--stroke); margin-top: 12px; }
  summary { min-height: 44px; padding: 10px 2px; font-weight: 650; }
  details > :not(summary) { margin-top: 8px; }
  .list-nodes { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; }
  .list-nodes > li { padding: 16px; margin: 0; border: 1px solid var(--stroke); border-radius: 12px; background: var(--surface); overflow-wrap: anywhere; }
  .list-nodes button { text-align: left; font-weight: 700; }
  .decision { padding: 18px 0; border-top: 1px solid var(--stroke); overflow-wrap: anywhere; }
  .decision:first-child { border-top: 0; }
  .source-path { color: var(--quiet); font-size: 13px; overflow-wrap: anywhere; }
  .error { padding: 16px; border: 1px solid var(--stroke); }
  #sources-section { margin: 24px 0; }
  @media (max-width: 760px) { .diagram-scroll svg { width: 720px; } }
  @media (max-width: 480px) { .masthead { padding: 16px 0; } .masthead-count { display: none; } .levels { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px; } .levels button { border-color: var(--stroke); } .toolbar { margin-top: 16px; align-items: stretch; } .picker, select, .tools { width: 100%; } .tools button { flex: 1; } }
  @media (prefers-reduced-motion: no-preference) { button, .node-box { transition: background-color .18s, border-color .18s, stroke .18s; } }
</style>
</head>
<body>
<main aria-label="Interactive architecture explorer">
  <header class="masthead">
    <div class="mark" aria-hidden="true">VA</div>
    <div><div class="brand">VA Motors</div><div class="brand-note">Architecture atlas</div></div>
    <div id="atlas-count" class="masthead-count"></div>
  </header>
  <nav id="levels" class="levels" aria-label="Architecture levels"></nav>
  <div class="toolbar">
    <div class="picker" id="picker"><label for="view-picker">View</label><select id="view-picker"></select></div>
    <div class="tools">
      <button id="list-toggle" type="button" aria-pressed="false">Read as list</button>
      <button id="download" type="button">Download HTML</button>
    </div>
  </div>
  <section id="view-section" aria-labelledby="view-title">
    <div id="view-kicker" class="eyebrow"></div>
    <h1 id="view-title"></h1>
    <p id="view-summary" class="muted"></p>
    <p id="scope" class="scope"></p>
    <div id="legend" class="legend" aria-label="Node status legend"></div>
    <div id="diagram-wrap">
      <p class="hint">Select a box for details. On a narrow screen, scroll the diagram sideways or choose <strong>Read as list</strong>.</p>
      <div id="diagram" class="diagram-scroll" role="region" aria-label="Architecture diagram; scroll horizontally on smaller screens. Tab to a node and press Enter or Space for details." tabindex="0"></div>
    </div>
    <section id="list-view" aria-label="Nodes and relationships" hidden></section>
    <section id="node-detail" class="detail-panel" aria-labelledby="detail-title" hidden></section>
    <details id="notes"><summary>View notes</summary><ul id="notes-list"></ul></details>
  </section>
  <section id="decisions-section" aria-labelledby="decisions-title" hidden>
    <div class="eyebrow">Rationale & trade-offs</div>
    <h1 id="decisions-title">Decisions</h1>
    <p class="muted">Open a decision to see its rationale and evidence.</p>
    <div id="decisions"></div>
  </section>
  <details id="sources-section"><summary>Source index</summary><ul id="source-list"></ul></details>
  <p id="announcement" class="hint" role="status" aria-live="polite"></p>
  <noscript><p>This explorer needs JavaScript to display its embedded architecture model.</p></noscript>
</main>

  function clearSelection() { document.querySelectorAll('[data-node-id]').forEach(el => el.setAttribute('aria-pressed', 'false')); }
  function wrap(text, maxChars) {
    const lines = []; let line = '';
    for (const word of String(text || '').split(/\s+/)) {
      // Split long identifiers too, so labels never spill across neighboring nodes.
      const chunks = word.match(new RegExp('.{1,' + maxChars + '}', 'g')) || [''];
      for (const chunk of chunks) {
        if (line && (line + ' ' + chunk).length > maxChars) { lines.push(line); line = ''; }
        line += (line ? ' ' : '') + chunk;
      }
    }
    if (line) lines.push(line);
    return lines.length ? lines : [''];
  }
  function renderDiagram() {
    const view = currentView, width = Number(view.width) || 720, height = Number(view.height) || 500;
    const root = svg('svg', {width, height, viewBox: `0 0 ${width} ${height}`, role: 'group', 'aria-labelledby': 'diagram-title diagram-desc'});
    root.append(svg('title', {id:'diagram-title'}, view.title), svg('desc', {id:'diagram-desc'}, (view.summary || '') + ' Directed arrows show relationships. Each node is a button. A complete HTML list is available using Read as list.'));
    const defs = svg('defs'), marker = svg('marker', {id:'arrow', viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:7, markerHeight:7, orient:'auto-start-reverse'});
    marker.append(svg('path', {d:'M 0 0 L 10 5 L 0 10 z', fill:'var(--line)'})); defs.append(marker); root.append(defs);
    array(view.groups).forEach(group => {
      root.append(svg('rect', {x:group.x, y:group.y, width:group.w, height:group.h, rx:8, class:'boundary'}));
      const label = svg('text', {x:Number(group.x)+12, y:Number(group.y)+22, class:'group-label'});
      wrap(group.name, Math.max(12, Math.floor((group.w-24)/7))).forEach((line, i) => label.append(svg('tspan', {x:Number(group.x)+12, dy:i ? 16 : 0}, line)));
      root.append(label);
    });
    const boxes = array(view.nodes).map(node => ({...node, x:Number(node.x)||0, y:Number(node.y)||0, w:Number(node.w)||184, h:Number(node.h)||128}));
    const byId = new Map(boxes.map(node => [node.id, node]));
    const labels = [];
    const overlap = (a,b) => a.x < b.x+b.w+5 && a.x+a.w+5 > b.x && a.y < b.y+b.h+5 && a.y+a.h+5 > b.y;
    const edgeLabels = svg('g', {'aria-hidden':'true'});
    array(view.edges).forEach((edge, index) => {
      const a = byId.get(edge.from), b = byId.get(edge.to);
      if (!a || !b) return;
      let points = edge.points;
      if (!Array.isArray(points) || points.length < 2) {
        const ac = [a.x+a.w/2,a.y+a.h/2], bc = [b.x+b.w/2,b.y+b.h/2];
        if (a.id === b.id) {
          points = [[a.x+a.w,a.y+a.h*.35],[a.x+a.w+30,a.y+a.h*.35],[a.x+a.w+30,a.y-24],[a.x+a.w/2,a.y-24],[a.x+a.w/2,a.y]];
        } else if (Math.abs(bc[0]-ac[0]) / ((a.w+b.w)/2) > Math.abs(bc[1]-ac[1]) / ((a.h+b.h)/2)) {
          const right = bc[0] >= ac[0], start = [right ? a.x+a.w : a.x,ac[1]], end = [right ? b.x : b.x+b.w,bc[1]];
          const middle = (start[0]+end[0])/2;
          points = [start,[middle,start[1]],[middle,end[1]],end];
        } else {
          const down = bc[1] >= ac[1], start = [ac[0],down ? a.y+a.h : a.y], end = [bc[0],down ? b.y : b.y+b.h];
          const middle = (start[1]+end[1])/2;
          points = [start,[start[0],middle],[end[0],middle],end];
        }
      }
      // Merge straight segments so their label sits at the full gap's midpoint.
      const clean = [];
      for (const p of points) {
        const last = clean.at(-1);
        if (last && p[0] === last[0] && p[1] === last[1]) continue;
        if (clean.length > 1) {
          const a = clean.at(-2), b = clean.at(-1);
          const straight = (b[0]-a[0])*(p[1]-b[1]) === (b[1]-a[1])*(p[0]-b[0]);
          const forward = (b[0]-a[0])*(p[0]-b[0]) + (b[1]-a[1])*(p[1]-b[1]) >= 0;
          if (straight && forward) clean.pop();
        }
        clean.push(p);
      }
      points = clean;
      const path = svg('path', {d:points.map((p,i) => (i?'L':'M') + p[0]+' '+p[1]).join(' '), class:'edge', 'marker-end':'url(#arrow)'});
      path.append(svg('title', {}, nodeName(edge.from)+' → '+nodeName(edge.to)+': '+(edge.label || ''))); root.append(path);
      if (!edge.label) return;
      const lines = wrap(edge.label, 18), lw = Math.max(...lines.map(line => line.length))*6.6+16, lh = lines.length*16+10;
      let lx = Number(edge.labelX), ly = Number(edge.labelY);
      if (edge.labelX == null || edge.labelY == null) {
        const candidates = [];
        for (let i=1;i<points.length;i++) {
          const p=points[i-1], q=points[i], length=Math.hypot(q[0]-p[0],q[1]-p[1]);
          if (length < 1) continue;
          [0,-20,20,-40,40].forEach(offset => candidates.push({x:(p[0]+q[0])/2, y:(p[1]+q[1])/2+offset, length, offset}));
        }
        // ponytail: local collision heuristic; use explicit points/labelX/labelY for dense diagrams.
        candidates.sort((p,q) => score(p)-score(q));
        function score(p) {
          const rect={x:p.x-lw/2,y:p.y-lh/2,w:lw,h:lh};
          return boxes.filter(box=>overlap(rect,box)).length*10000 + labels.filter(box=>overlap(rect,box)).length*2000 + (rect.x<0 || rect.y<0 || rect.x+lw>width || rect.y+lh>height ? 5000 : 0) + Math.abs(p.offset)*2-p.length;
        }
        lx = candidates[0]?.x || width/2; ly = candidates[0]?.y || 30+index*30;
        lx = Math.max(lw/2+4, Math.min(width-lw/2-4, lx)); ly = Math.max(lh/2+4, Math.min(height-lh/2-4, ly));
      }
      labels.push({x:lx-lw/2,y:ly-lh/2,w:lw,h:lh});
      edgeLabels.append(svg('rect', {x:lx-lw/2,y:ly-lh/2,width:lw,height:lh,rx:4,class:'edge-label-bg'}));
      const text = svg('text', {x:lx,y:ly-(lines.length-1)*8+4,'text-anchor':'middle',class:'edge-label'});
      lines.forEach((line,i) => text.append(svg('tspan',{x:lx,dy:i?16:0},line))); edgeLabels.append(text);
    });
    root.append(edgeLabels);
    boxes.forEach(node => {
      const group = svg('g', {class:'node '+String(node.status || '').toLowerCase(), tabindex:0, role:'button', 'aria-pressed':'false', 'aria-controls':'node-detail', 'aria-label':[node.name,node.type,node.technology,node.status,'Show details'].filter(Boolean).join('. '), 'data-node-id':node.id});
      group.append(svg('rect', {x:node.x,y:node.y,width:node.w,height:node.h,rx:7,class:'node-box'}));
      const foreign = svg('foreignObject', {x:node.x,y:node.y,width:node.w,height:node.h,'aria-hidden':'true'});
      const label = html('div',null,'node-label'); label.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
      label.append(html('div',node.name,'node-name'));
      if (node.type) label.append(html('div',node.type,'node-meta'));
      if (node.technology) label.append(html('div',node.technology,'node-meta'));
      if (node.status) label.append(html('div',node.status,'node-status'));
      foreign.append(label); group.append(foreign);
      group.addEventListener('click', () => selectNode(node));
      group.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectNode(node,true); } });
      root.append(group);
    });
    $('diagram').replaceChildren(root);
    $('diagram').scrollLeft = 0;
  }
  function renderList() {
    const target = $('list-view'); target.replaceChildren();
    const ul = html('ul', null, 'list-nodes');
    array(currentView.nodes).forEach(node => {
      const li=html('li'), button=html('button',node.name);
      button.type='button'; button.dataset.nodeId=node.id; button.setAttribute('aria-pressed','false'); button.setAttribute('aria-controls','node-detail');
      button.onclick=()=>selectNode(node,true); li.append(button);
      li.append(html('p',[node.type,node.technology,node.status].filter(Boolean).join(' · '),'muted'));
      if (node.description) li.append(html('p',node.description));
      ul.append(li);
    });
    target.append(html('h2','Nodes'),ul,html('h2','All relationships'));
    const connections=html('ul'); array(currentView.edges).forEach(edge=>connections.append(relationship(edge)));
    target.append(connections.children.length ? connections : html('p','No relationships in this view.','muted'));
  }
  function renderView() {
    if (!currentView) return;
    $('node-detail').hidden=true; $('announcement').textContent='';
    $('view-kicker').textContent=[levels.find(([id])=>id===currentLevel)?.[1],currentView.state].filter(Boolean).join(' / ');
    $('view-title').textContent=currentView.title || 'Architecture view';
    $('view-summary').textContent=currentView.summary || ''; $('view-summary').hidden=!currentView.summary;
    $('scope').textContent=currentView.scope ? 'Scope: '+currentView.scope : ''; $('scope').hidden=!currentView.scope;
    $('legend').replaceChildren();
    [...new Set(array(currentView.nodes).map(node=>node.status).filter(Boolean))].forEach(status=>{
      const item=html('span'), swatch=html('i',null,'swatch '+String(status).toLowerCase()); swatch.setAttribute('aria-hidden','true'); item.append(swatch,document.createTextNode(status)); $('legend').append(item);
    });
    $('notes-list').replaceChildren(); array(currentView.notes).forEach(note=>$('notes-list').append(html('li',note)));
    $('notes').hidden=!array(currentView.notes).length; $('notes').open=false;
    renderDiagram(); renderList(); setListMode();
  }
  function setListMode() {
    $('list-toggle').setAttribute('aria-pressed',String(listMode));
    $('list-toggle').textContent=listMode?'Show diagram':'Read as list';
    $('diagram-wrap').hidden=listMode; $('list-view').hidden=!listMode;
  }
  function selectLevel(level) {
    currentLevel=level;
    Array.from($('levels').children).forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.level===level)));
    const decisions=level==='Decisions';
    $('view-section').hidden=decisions; $('decisions-section').hidden=!decisions; $('picker').hidden=decisions; $('list-toggle').hidden=decisions;
    $('announcement').textContent='';
    if (decisions) return;
    const views=model.views.filter(view=>levelOf(view)===level);
    currentView=views.find(view=>view.id===remembered.get(level)) || views[0];
    $('view-picker').replaceChildren();
    views.forEach(view=>{ const option=html('option', view.title); option.value=view.id; $('view-picker').append(option); });
    $('view-picker').value=currentView.id; renderView();
  }
  levels.forEach(([level,label])=>{
    const button=html('button',label); button.type='button'; button.dataset.level=level; button.setAttribute('aria-pressed','false');
    button.disabled=level!=='Decisions'&&!model.views.some(view=>levelOf(view)===level);
    if (button.disabled) button.title='No views supplied for this level';
    button.onclick=()=>selectLevel(level); $('levels').append(button);
  });
  $('view-picker').onchange=event=>{ currentView=model.views.find(view=>view.id===event.target.value); remembered.set(currentLevel,currentView.id); renderView(); };
  $('list-toggle').onclick=()=>{ listMode=!listMode; setListMode(); };
  array(model.decisions).forEach(decision=>{
    const article=html('article',null,'decision'); article.append(html('h2',decision.title));
    if(decision.status) article.append(html('span',decision.status,'tag'));
    paragraphs(article,decision.summary);
    const detail=html('details'); detail.append(html('summary','Rationale & evidence')); paragraphs(detail,decision.detail); detail.append(evidence(decision.sources)); article.append(detail); $('decisions').append(article);
  });
  if(!array(model.decisions).length) $('decisions').append(html('p','No decisions supplied.','muted'));
  array(model.sources).forEach(source=>$('source-list').append(sourceItem(source.id)));
  if(!array(model.sources).length) $('source-list').append(html('li','No sources supplied.'));
  $('download').onclick=()=>{
    // Export the original shell, not the populated DOM (which would duplicate live diagrams).
    const clone=document.documentElement.cloneNode(true);
    ['levels','view-picker','diagram','list-view','node-detail','notes-list','decisions','source-list','legend','announcement'].forEach(id=>clone.querySelector('#'+id).replaceChildren());
    clone.querySelector('#node-detail').hidden=true;
    const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob), link=html('a'); link.href=url; link.download='architecture.html'; document.body.append(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    $('announcement').textContent='Self-contained HTML download requested.';
  };
  selectLevel(currentLevel);
})();
