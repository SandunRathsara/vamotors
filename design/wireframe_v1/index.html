<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — VA Motors</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <img src="va_motors_logo.jpeg" alt="VA Motors Logo" />
        <h1>VA Motors</h1>
        <p class="subtitle">Vehicle Sale Management System</p>

        <form
          onsubmit="
            event.preventDefault();
            window.location.href = 'dashboard.html';
          "
        >
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input
              type="email"
              class="form-control"
              value="admin@vamotors.lk"
              placeholder="Enter your email"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              value="••••••••"
              placeholder="Enter your password"
            />
          </div>
          <div style="text-align: left; margin-bottom: 16px">
            <label
              style="
                font-size: 13px;
                display: flex;
                align-items: center;
                gap: 6px;
                cursor: pointer;
              "
            >
              <input type="checkbox" checked /> Remember me
            </label>
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
        </form>

        <p style="margin-top: 24px; font-size: 12px; color: var(--text-muted)">
          © 2026 VA Motors. All rights reserved.
        </p>
      </div>
    </div>
  </body>
</html>
